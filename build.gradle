plugins {
    id 'java'
}

group = 'com.example.burp'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.2'
}

// Keep this compatible with older Gradle installs that lack the `java {}` toolchain DSL.
sourceCompatibility = 17
targetCompatibility = 17

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
